name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel and run the offline example
        run: |
          python -m venv "$RUNNER_TEMP/tbgen-venv"
          "$RUNNER_TEMP/tbgen-venv/bin/python" -m pip install --no-deps dist/*.whl
          cp examples/generic-request.json "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tbgen-venv/bin/vco-tbgen" plan generic-request.json --json --output plan.json
          "$RUNNER_TEMP/tbgen-venv/bin/python" -c 'import json; from pathlib import Path; assert json.loads(Path("plan.json").read_text())["status"] == "ready"'
