[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vco-tbgen"
version = "1.0.0"
description = "Generate testbenches for LC VCOs in Virtuoso and Maestro"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.scripts]
vco-tbgen = "vco_tbgen.__main__:main"

[tool.setuptools]
packages = ["vco_tbgen", "vco_tbgen.resources"]

[tool.setuptools.package-data]
vco_tbgen = ["resources/*.json", "resources/*.il"]
